<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#g1)"/>
  <!-- decorative diamond pattern -->
  <polygon points="400,60 460,140 400,220 340,140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  <polygon points="400,80 450,140 400,200 350,140" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
  <!-- dots -->
  <circle cx="400" cy="140" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="140" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="460" cy="140" r="3" fill="#ffffff" opacity="0.4"/>
  <!-- text block centred vertically in usable area (60–480) -->
  <text x="400" y="310" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="6">✦ COLEÇÃO ✦</text>
  <text x="400" y="368" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">NAVAJO</text>
  <text x="400" y="410" font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="3">Joias e acessórios artesanais</text>
  <!-- bottom line — leaves 80px of clear space below for dots -->
  <line x1="320" y1="432" x2="480" y2="432" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
