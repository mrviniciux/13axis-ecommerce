services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/storefront/.next
    working_dir: /app/apps/storefront
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0"]
