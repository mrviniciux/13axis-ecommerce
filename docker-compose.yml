services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axis_store}
      POSTGRES_USER: ${POSTGRES_USER:-axis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: 13axis-ecommerce:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axis_admin}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-axis_store}
    working_dir: /app/apps/storefront
    command:
      [
        "pnpm",
        "exec",
        "prisma",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma",
      ]
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: 13axis-ecommerce:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axis_admin}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-axis_store}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/storefront/node_modules
    working_dir: /app/apps/storefront
    command: ["pnpm", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: 13axis-ecommerce:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-axis_admin}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-axis_store}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploy-please}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      AUTH_TRUST_HOST: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/storefront/node_modules
      - /app/apps/storefront/.next
    working_dir: /app/apps/storefront
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-c",
        "pnpm db:generate && pnpm exec next dev --hostname 0.0.0.0",
      ]

volumes:
  postgres_data:
