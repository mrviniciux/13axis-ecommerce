[build]
  base = "apps/storefront"
  command = "pnpm build"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = ""

[dev]
  command = "pnpm dev"
  port = 3000

[[redirects]]
  from = "/br/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/us/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
