[build]
  base = "apps/storefront"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_API_URL = ""
  # Netlify Database is PostgreSQL. Local development defaults to MySQL.
  DATABASE_PROVIDER = "postgresql"

[dev]
  command = "pnpm dev"
  port = 3000

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/_next/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
